// Packages the natively built MM core into an APK. The native libraries are not built by Gradle: the
// CI job cross-compiles them with CMake and copies them into src/main/jniLibs, and copies SDL's Java
// activity (matching the SDL version that was built) into src/main/java/org/libsdl/app.
plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.lokodoshape.zelda3d'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.lokodoshape.zelda3d'
        minSdk 29
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
        versionName "0.1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
